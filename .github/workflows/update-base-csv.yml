name: Atualizar dashboard
on:
  push:
    paths:
      - 'base.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar HTML com snapshot atualizado
        run: python3 gerar_dashboard.py

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Atualiza dashboard $(date +'%d/%m/%Y')"
          git push
