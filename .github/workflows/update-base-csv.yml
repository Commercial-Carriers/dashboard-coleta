name: Atualizar base.csv
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"
permissions:
  contents: write
jobs:
  atualizacao-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Baixar dados via Apps Script
        run: |
          curl -L "https://script.google.com/a/macros/mercadolivre.com/s/AKfycbzWtXeeWuy9VmQ9hh7XbYhfe8p7mLK8UFHx1RO2dzskyLGcmlB6zXV8oX17AvJS8PMZ1w/exec" -o base.csv
          if grep -qi "<!DOCTYPE html\|<html" base.csv; then
            echo "Erro: o arquivo baixado não é CSV, é HTML."
            exit 1
          fi
          head -n 1 base.csv
      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Commit e push se houver alteração
        run: |
          git add base.csv
          git diff --cached --quiet || git commit -m "Atualiza base.csv automaticamente"
          git push
