name: Atualizar base.csv

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  atualizacao-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Baixar CSV do Google Sheets
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1kRrGyoe9nSf1-UpJuCG4p905ygYadOTJ3y9yTquXKi8/export?format=csv&gid=582069458" -o base.csv

          if grep -qi "<!DOCTYPE html\|<html" base.csv; then
            echo "Erro: o arquivo baixado não é CSV, é HTML."
            exit 1
          fi

      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit e push se houver alteração
        run: |
          git add base.csv
          git diff --cached --quiet || git commit -m "Atualiza base.csv automaticamente"
          git push
